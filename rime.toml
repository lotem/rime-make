# Rime 配方管理器 基礎任務定義

[config]
min_version = "0.30.6"

[env]
DOWNLOAD_DIR = "pkg"
SOURCE_DIR = "src"
STAGING_DIR = "stage"
TARGET_DIR = "target"

[env.ibus-rime]
TARGET_DIR = "${HOME}/.config/ibus/rime"

[env.fcitx-rime]
TARGET_DIR = "${HOME}/.config/fcitx/rime"

[env.weasel]
TARGET_DIR = "${APPDATA}/Rime"

[env.squirrel]
TARGET_DIR = "${HOME}/Library/Rime"

[env.emacs-rime]
TARGET_DIR = { script = ["emacs --quick --batch --eval '(princ (expand-file-name \"rime\" user-emacs-directory))'"] }

# This task overrides the predefined |default| cargo-make task.
[tasks.default]
description = "起始目標"
clear = true
run_task = "test"

[tasks.deploy]
description = "部署輸入法數據到 TARGET_DIR 變量所指的位置，爲輸入法客戶端所用"
command = "echo"
args = ["cp", "-a", "-T", "${STAGING_DIR}", "${TARGET_DIR}"]
dependencies = ["test"]

[tasks.test]
description = "在 STAGING_DIR 工作區中測試構建好的輸入法數據"
clear = true
command = "echo"
args = ["rime", "test"]
dependencies = ["build"]

[tasks.build]
description = "構建輸入法數據，將結果文件存入 STAGING_DIR"
clear = true
command = "echo"
args = ["rime_deployer", "--build", "${SOURCE_DIR}", "${SOURCE_DIR}", "${STAGING_DIR}/build"]
dependencies = ["update-workspace"]

[tasks.update-workspace]
description = "更新調製配方工作區"
dependencies = ["init-workspace"]
run_task = "fill-prescription"

[tasks.init-workspace]
description = "預備調製配方工作區。爲抓取配方前的工作預留的步驟，例如在此步驟拉取用家的個人配置倉庫"
command = "echo"
args = ["Initializing workspace"]

[tasks.fill-prescription]
description = "照單抓取配方"
run_task = "recipes"

[tasks.recipes]
description = "由用家擬定的配方清單。請在 user.toml 文件中展開定義"

[tasks.recipe]
description = "抓取配方。此爲標準流程，請在具體配方的任務中展開定義"
run_task = { "name" = [
  "download-recipe",
  "build-recipe",
  "install-recipe",
] }

[tasks.download-recipe]
description = "下載配方包"
command = "echo"
args = ["rime", "download", "${RECIPE}"]

[tasks.build-recipe]
description = "構建配方包（供自定義配方擴展）"

[tasks.install-recipe]
description = "安裝配方文件（源碼寫入 SOURCE_DIR，運行時資源寫入 STAGING_DIR）"
command = "echo"
args = ["rime", "install", "--no-download", "${RECIPE}"]

[tasks.test-recipe]
description = "測試配方"
command = "echo"
args = ["rime", "test", "${RECIPE}"]

[tasks.customize]
description = "自定義"
